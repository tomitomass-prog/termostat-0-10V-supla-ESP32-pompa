[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
lib_ldf_mode = deep
build_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter
lib_deps =
  ; Arduino-ESP32 built-ins used indirectly by SUPLA. Declaring them explicitly
  ; makes PlatformIO add their include/link paths even when LDF does not see
  ; transitive includes inside SuplaDevice / HTTPUpdateServer.
  Networking
  WiFi
  WebServer
  HTTPUpdateServer
  Update
  DNSServer
  Preferences
  EEPROM
  Ticker
  FS
  LittleFS
  SPIFFS
  NetworkClientSecure
  Wire
  SPI
  https://github.com/SUPLA/supla-device.git#v26.4
  milesburton/DallasTemperature@4.0.6
  paulstoffregen/OneWire@2.3.8
  adafruit/Adafruit SSD1306@2.5.17
  adafruit/Adafruit GFX Library@1.12.6
